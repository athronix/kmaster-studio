<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 启动占位页：本地静态文件，禁止任何外部资源；CSP 收紧到最小面 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>kmaster studio</title>
    <style>
      :root {
        --bg: #141414;
        --fg: #e8e8e8;
        --muted: #8a8a8a;
        --accent: #63e2b7;
        --danger: #e88080;
        --border: #2a2a2a;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
      }
      .brand { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .msg { font-size: 14px; color: var(--muted); min-height: 20px; }
      .panel {
        display: none;
        max-width: 620px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        text-align: left;
        background: #1a1a1a;
      }
      .panel.show { display: block; }
      .panel h2 { margin: 0 0 10px; font-size: 15px; color: var(--danger); }
      .panel p { margin: 6px 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
      .path {
        display: block;
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #101010;
        border: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        color: #b9b9b9;
        word-break: break-all;
        -webkit-user-select: text;
        user-select: text;
      }
      .actions { margin-top: 16px; display: flex; gap: 10px; }
      button {
        border: 1px solid var(--border);
        background: #232323;
        color: var(--fg);
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .hide { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">kmaster studio</div>
      <div class="spinner" id="spinner"></div>
      <div class="msg" id="msg">正在启动…</div>

      <div class="panel" id="errorPanel">
        <h2>server 启动失败</h2>
        <p id="errorMsg"></p>
        <p>
          可先在仓库根执行 <code>npm run build</code> 确认 server 已构建；若问题持续，请查看日志：
          <span class="path" id="logPath">—</span>
        </p>
        <div class="actions">
          <button id="retryBtn" type="button">重试</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var msg = document.getElementById('msg');
        var spinner = document.getElementById('spinner');
        var panel = document.getElementById('errorPanel');
        var errorMsg = document.getElementById('errorMsg');
        var logPath = document.getElementById('logPath');
        var retryBtn = document.getElementById('retryBtn');
        var bridge = window.kmasterDesktop;

        function toFailed(status) {
          spinner.classList.add('hide');
          panel.classList.add('show');
          msg.textContent = '启动未完成';
          errorMsg.textContent = status && status.message ? status.message : '未知错误';
          logPath.textContent = (status && status.log_path) || '—';
          retryBtn.disabled = false;
        }

        function toRunning(status) {
          spinner.classList.remove('hide');
          panel.classList.remove('show');
          msg.textContent = (status && status.message) || '正在启动…';
        }

        if (!bridge) {
          // 非桌面宿主直接打开本文件时的兜底，不报错
          msg.textContent = '等待桌面壳注入状态…';
          return;
        }

        bridge.onServerStatus(function (status) {
          if (status && status.phase === 'failed') toFailed(status);
          else toRunning(status);
        });

        retryBtn.addEventListener('click', function () {
          retryBtn.disabled = true;
          toRunning({ message: '正在重试…' });
          Promise.resolve(bridge.retryServer()).catch(function (err) {
            toFailed({ message: String((err && err.message) || err), log_path: logPath.textContent });
          });
        });
      })();
    </script>
  </body>
</html>
