name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  KMASTER_NO_EMPTY_DIST: "1"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            dist_cmd: npm run dist:win
            artifact_pattern: "packages/desktop/dist-electron/*.exe"
          - os: macos-latest
            platform: mac
            dist_cmd: npm run dist:mac
            artifact_pattern: "packages/desktop/dist-electron/*.dmg"
          - os: ubuntu-latest
            platform: linux
            dist_cmd: npm run dist:linux
            artifact_pattern: "packages/desktop/dist-electron/*.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Build client & server
        run: npm run build

      - name: Dist (${{ matrix.platform }})
        run: ${{ matrix.dist_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmaster-studio-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kmaster-studio-*
          merge-multiple: true
          path: dist/

      - name: List artifacts
        run: ls -lah dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist/*
